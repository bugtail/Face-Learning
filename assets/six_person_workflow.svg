<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1450" viewBox="0 0 1120 1450" role="img" aria-labelledby="title desc">
<title id="title">桌面｜六人分組實驗</title><desc id="desc">A 與 F 備妥共同輸入，B/C 與 D/E 各自完成配對實驗，再匯整到 A/F，鎖定設定後執行正式測試並完成報告。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linejoin="round"/></marker></defs>
<rect width="1120" height="1450" fill="#fffefa"/>
<g font-family="'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif">
<path id="a-to-f" d="M540 261 L580 261" fill="none" stroke="#315e77" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path id="input-to-bc" d="M830 340 L830 382 L290 382 L290 478" fill="none" stroke="#9aa79e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path id="input-to-de" d="M830 382 L830 478" fill="none" stroke="#9aa79e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path id="bc-to-de" d="M540 636 L580 636" fill="none" stroke="#40664c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path id="bc-to-merge" d="M290 820 L290 860 L560 860" fill="none" stroke="#40664c" stroke-width="2" stroke-linejoin="round" />
<path id="de-to-merge" d="M830 820 L830 860 L560 860" fill="none" stroke="#705a76" stroke-width="2" stroke-linejoin="round" />
<path id="results-to-af" d="M560 860 L560 938" fill="none" stroke="#202923" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path id="af-to-test" d="M560 1096 L560 1148 L290 1148 L290 1170" fill="none" stroke="#202923" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path id="test-to-report" d="M540 1252 L580 1252" fill="none" stroke="#85603a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text id="text-0"  x="40" y="60" font-size="36" font-weight="700" fill="#202923" text-anchor="start">六個角色，兩組實驗，一起交付。</text>
<text id="text-1"  x="40" y="101" font-size="20" font-weight="400" fill="#59655d" text-anchor="start">資料與切分先一致；兩組完成實驗後，再匯入 A / F。</text>
<text id="text-2"  x="40" y="155" font-size="16" font-weight="700" fill="#59655d" text-anchor="start">01　共同輸入</text>
<rect id="card-a" x="40" y="182" width="500" height="158" rx="16" fill="#f1f5f7" stroke="#d7dfd8"/>
<text id="text-3" data-card="card-a" x="64" y="222" font-size="25" font-weight="700" fill="#315e77" text-anchor="start">A　資料整理</text>
<text id="text-4" data-card="card-a" x="64" y="263" font-size="20" font-weight="400" fill="#202923" text-anchor="start">200 張訓練圖 → train_dataset.mat</text>
<text id="text-5" data-card="card-a" x="64" y="299" font-size="20" font-weight="400" fill="#202923" text-anchor="start">另備 100 張正式測試圖，分開封存。</text>
<rect id="card-f" x="580" y="182" width="500" height="158" rx="16" fill="#f1f5f7" stroke="#d7dfd8"/>
<text id="text-6" data-card="card-f" x="604" y="222" font-size="25" font-weight="700" fill="#315e77" text-anchor="start">F　共同切分</text>
<text id="text-7" data-card="card-f" x="604" y="263" font-size="20" font-weight="400" fill="#202923" text-anchor="start">只用訓練集 → fold_manifest.csv</text>
<text id="text-8" data-card="card-f" x="604" y="299" font-size="20" font-weight="400" fill="#202923" text-anchor="start">同組不跨折；四種方法共用五折。</text>
<text id="text-9"  x="40" y="449" font-size="16" font-weight="700" fill="#59655d" text-anchor="start">02　兩組各自實驗與 review</text>
<rect id="card-bc" x="40" y="478" width="500" height="342" rx="16" fill="#f0f5ee" stroke="#d7dfd8"/>
<text id="text-10" data-card="card-bc" x="64" y="518" font-size="25" font-weight="700" fill="#40664c" text-anchor="start">B / C　降維實驗</text>
<text id="text-11" data-card="card-bc" x="64" y="557" font-size="21" font-weight="700" fill="#40664c" text-anchor="start">B：PCA　　C：Fisher LDA</text>
<text id="text-12" data-card="card-bc" x="64" y="601" font-size="20" font-weight="400" fill="#202923" text-anchor="start">① 先確認 fit / transform 介面</text>
<text id="text-13" data-card="card-bc" x="64" y="636" font-size="20" font-weight="400" fill="#202923" text-anchor="start">② 每折只用 train fit，再投影 validation</text>
<text id="text-14" data-card="card-bc" x="64" y="671" font-size="20" font-weight="400" fill="#202923" text-anchor="start">③ 互查維度、秩與投影結果</text>
<text id="text-15" data-card="card-bc" x="64" y="725" font-size="15" font-weight="700" fill="#59655d" text-anchor="start">這組要交付</text>
<text id="text-16" data-card="card-bc" x="64" y="758" font-size="19" font-weight="400" fill="#202923" text-anchor="start">reducer API · reduction_summary.csv</text>
<text id="text-17" data-card="card-bc" x="64" y="788" font-size="19" font-weight="400" fill="#202923" text-anchor="start">維度與投影檢查結果、合成測試</text>
<rect id="card-de" x="580" y="478" width="500" height="342" rx="16" fill="#f5f0f6" stroke="#d7dfd8"/>
<text id="text-18" data-card="card-de" x="604" y="518" font-size="25" font-weight="700" fill="#705a76" text-anchor="start">D / E　分類器實驗</text>
<text id="text-19" data-card="card-de" x="604" y="557" font-size="21" font-weight="700" fill="#705a76" text-anchor="start">D：Bayes　　E：MLP</text>
<text id="text-20" data-card="card-de" x="604" y="601" font-size="20" font-weight="400" fill="#202923" text-anchor="start">① 兩人先用合成特徵測分類介面</text>
<text id="text-21" data-card="card-de" x="604" y="636" font-size="20" font-weight="400" fill="#202923" text-anchor="start">② 接 B/C reducer，跑同一份五折</text>
<text id="text-22" data-card="card-de" x="604" y="671" font-size="20" font-weight="400" fill="#202923" text-anchor="start">③ 互查標籤、分數欄位與設定</text>
<text id="text-23" data-card="card-de" x="604" y="725" font-size="15" font-weight="700" fill="#59655d" text-anchor="start">這組要交付</text>
<text id="text-24" data-card="card-de" x="604" y="758" font-size="19" font-weight="400" fill="#202923" text-anchor="start">classifier API · classifier_summary.csv</text>
<text id="text-25" data-card="card-de" x="604" y="788" font-size="19" font-weight="400" fill="#202923" text-anchor="start">各折預測、參數量、訓練與推論時間</text>
<text id="text-26"  x="40" y="906" font-size="16" font-weight="700" fill="#59655d" text-anchor="start">03　兩組完成後，交給 A / F</text>
<rect id="card-af" x="40" y="938" width="1040" height="158" rx="16" fill="#eaf1eb" stroke="#d7dfd8"/>
<text id="text-27" data-card="card-af" x="64" y="978" font-size="26" font-weight="700" fill="#40664c" text-anchor="start">A / F　匯整兩組實驗</text>
<text id="text-28" data-card="card-af" x="64" y="1024" font-size="20" font-weight="400" fill="#202923" text-anchor="start">整合 PCA / LDA × Bayes / MLP；核對共同五折的數據與格式。</text>
<text id="text-29" data-card="card-af" x="64" y="1061" font-size="20" font-weight="400" fill="#202923" text-anchor="start">彙整 Accuracy、ROC/AUC、維度、參數量與時間，鎖定程式與設定。</text>
<text id="text-30"  x="40" y="1142" font-size="16" font-weight="700" fill="#59655d" text-anchor="start">04　正式測試 → 報告</text>
<rect id="card-test" x="40" y="1170" width="500" height="164" rx="16" fill="#faf3e9" stroke="#d7dfd8"/>
<text id="text-31" data-card="card-test" x="64" y="1210" font-size="24" font-weight="700" fill="#85603a" text-anchor="start">F　正式測試</text>
<text id="text-32" data-card="card-test" x="64" y="1251" font-size="19" font-weight="400" fill="#202923" text-anchor="start">全部訓練圖重新 fit，再評估正式測試集。</text>
<text id="text-33" data-card="card-test" x="64" y="1287" font-size="19" font-weight="400" fill="#202923" text-anchor="start">由 A 解除封存、F 執行並記錄結果。</text>
<rect id="card-report" x="580" y="1170" width="500" height="164" rx="16" fill="#f3f3ef" stroke="#d7dfd8"/>
<text id="text-34" data-card="card-report" x="604" y="1210" font-size="24" font-weight="700" fill="#202923" text-anchor="start">全員　簡報與書面報告</text>
<text id="text-35" data-card="card-report" x="604" y="1251" font-size="19" font-weight="400" fill="#202923" text-anchor="start">B/C、D/E 交方法與結果；A/F 統整。</text>
<text id="text-36" data-card="card-report" x="604" y="1287" font-size="19" font-weight="400" fill="#202923" text-anchor="start">兩份文件使用相同名稱、設定與數字。</text>
<text id="text-37"  x="40" y="1380" font-size="18" font-weight="400" fill="#59655d" text-anchor="start">每折只用 train fit；正式測試集等設定鎖定後才使用。</text>
<text id="text-38"  x="40" y="1414" font-size="17" font-weight="400" fill="#59655d" text-anchor="start">橫向箭頭：B/C 的 reducer 交給 D/E；兩組實驗結果最後在 A/F 匯合。</text>
</g></svg>
